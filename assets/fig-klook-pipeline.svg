<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 420" width="2000" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1f23"/></marker></defs><rect width="2000" height="420" fill="#ffffff"/><rect x="8" y="8" width="420" height="404" rx="18" fill="#f3f4f6" stroke="#2d3036" stroke-width="2.5"/><text x="30" y="48" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Stage (1) Single-Prompt</text><text x="30" y="78" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Translation</text><rect x="448" y="8" width="440" height="404" rx="18" fill="#e6f0fb" stroke="#2d3036" stroke-width="2.5"/><text x="470" y="48" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Stage (2) Error Analysis</text><rect x="908" y="8" width="400" height="404" rx="18" fill="#eaf5e9" stroke="#2d3036" stroke-width="2.5"/><text x="930" y="48" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Stage (3) Error-Aware</text><text x="930" y="78" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Prompts</text><rect x="1328" y="8" width="320" height="404" rx="18" fill="#ffffff" stroke="#2d3036" stroke-width="2.5"/><text x="1350" y="48" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Stage (4) Metric</text><text x="1350" y="78" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Evaluation</text><rect x="1668" y="8" width="324" height="404" rx="18" fill="#f7f1e8" stroke="#2d3036" stroke-width="2.5"/><text x="1690" y="48" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111">Stage (5) Production</text><path d="M40,150 H84 L96,162 V222 H40 Z" fill="#fff" stroke="#1d1f23" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M84,150 V162 H96" fill="none" stroke="#1d1f23" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="49" y1="172" x2="87" y2="172" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="49" y1="181" x2="87" y2="181" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="49" y1="190" x2="87" y2="190" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="49" y1="199" x2="87" y2="199" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="49" y1="208" x2="87" y2="208" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><text x="68" y="250" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1d1f23">travel content</text><line x1="106" y1="186" x2="152" y2="186" stroke="#1d1f23" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><path d="M196,152 C200,180 202,182 230,186 C202,190 200,192 196,220 C192,192 190,190 162,186 C190,182 192,180 196,152 Z" fill="#eaf1fd" stroke="#2a78d6" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="196" y="250" font-family="Helvetica Neue, Helvetica, Arial, Apple SD G