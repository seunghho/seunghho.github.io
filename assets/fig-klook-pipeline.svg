e" stroke="#1d1f23" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="343" y1="186" x2="375" y2="186" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="343" y1="195" x2="375" y2="195" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="343" y1="204" x2="375" y2="204" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><line x1="343" y1="213" x2="375" y2="213" stroke="#1d1f23" stroke-width="1.6" stroke-linecap="round"/><text x="352" y="270" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1d1f23">many languages</text><text x="218" y="360" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#6b6f76">same prompt for every language</text><line x1="416" y1="210" x2="466" y2="210" stroke="#1d1f23" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="470" y="96" width="120" height="28" rx="6" fill="#fff" stroke="#1d1f23" stroke-width="1.8"/><text x="530.0" y="115" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1f23">GLOSSARY</text><text x="606" y="116" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1d1f23">First 산</text><path d="M606,124 q4,-4 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0" fill="none" stroke="#e34948" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="606" y="146" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#6b6f76">glossary term: 피르스트 산</text><rect x="470" y="186" width="196" height="28" rx="6" fill="#fff" stroke="#1d1f23" stroke-width="1.8"/><text x="568.0" y="205" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1f23">LOCALE CONVENTION</text><text x="482" y="240" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1d1f23">진자 드 오비두스</text><path d="M482,248 q4,-4 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0" fill="none" stroke="#e34948" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="482" y="270" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#6b6f76">Ginja de Óbidos, rendered by sound</text><text x="482" y="310" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1d1f23">해외 팽창</text><path d="M482,318 q4,-4 8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0 t8,0" fill="none" stroke="#e34948" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="482" y="340" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#6b6f76">“overseas expansion”, too literal</text><line x1="876" y1="210" x2="926" y2="210" stroke="#1d1f23" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="934" y="96" width="348" height="232" rx="10" fill="#fff" stroke="#1d1f23" stroke-width="2.2"/><text x="950" y="124" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b6f76">prompt for one language (e.g., ko)</text><text x="952" y="160" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="#1d1f23">+ use glossary terms</text><text x="952" y="196" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="#1d1f23">+ follow locale conventions</text><text x="952" y="232" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="#1d1f23">+ avoid literal phrasing</text><text x="952" y="268" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" text-anchor="start" fill="#6b6f76">+ language-specific traits</text><text x="1108" y="360" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#6b6f76">built from the error patterns</text><line x1="1296" y1="210" x2="1346" y2="210" stroke="#1d1f23" stroke-width="4.5" stroke-linecap="round" marker-end="url(#ah)"/><path d="M1402,236 A86,86 0 0 1 1574,236" fill="none" stroke="#d4d7dc" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M1402,236 A86,86 0 0 1 1559.6,188.3" fill="none" stroke="#2a78d6" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><line x1="1488" y1="236" x2="1524.5813895966219" y2="181.06547592651623" stroke="#6b6f76" stroke-width="3" stroke-linecap="round"/><line x1="1488" y1="236" x2="1542.9345240734838" y2="199.41861040337818" stroke="#1d1f23" stroke-width="4" stroke-linecap="round"/><circle cx="1488" cy="236" r="7" fill="#1d1f23"/><text x="1488" y="284" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#6b6f76">BLEURT</text><text x="1488" y="316" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1f23">0.687 → 0.813</text><line x1="1636" y1="210" x2="1686" y2="210" stroke="#1d